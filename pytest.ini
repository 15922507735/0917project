[pytest]
# 测试用例搜索路径：仅在 testcase_manage 下收集 test_*.py
testpaths = testcase_manage
# 把项目根目录加入 sys.path，替代 conftest 中手动 sys.path.insert
# （pytest 7+ 原生支持，避免路径污染与导入顺序问题）
pythonpath = .
# 默认命令行参数：详细模式 + 短堆栈 + 显式禁用任何随机收集插件
# （防止以后误装 pytest-randomly 等导致用例乱序，破坏强状态链）
addopts = -v --tb=short -p no:randomly
# 自定义标记：避免 pytest 报 "unknown marker" 警告
markers =
    smoke: 冒烟用例（核心路径，快速验证）
    regression: 回归用例（覆盖度更广）
    business: 业务用例（与具体业务模块相关）
    critical_path: 关键路径（核心 E2E，发布前必跑）
    requires_login: 依赖登录态（用例 5 / 21-33 强状态链）

    # ===== 业务模块 feature 标签 =====
    feature_login: 登录模块（含冒烟 / 未登录 / 手机号密码登录）
    feature_order: 订单模块（聚合页 / 立即订购）
    feature_seecar_shequ: 看车 + 社区模块
    feature_huodong: 活动模块
    feature_fatie: 发帖模块
    feature_fuwu: 服务模块（含门店、家充等）
    feature_mine: 我的模块（含皮肤、设置、签到等）
    feature_buycar: 购车模块（含配置、订购、定金）

    # ===== 子功能 story 标签（模块内细分） =====
    # login
    story_smoke: 启动冒烟（包名 / Activity 断言）
    story_logout: 进入我的 + 未登录入口
    story_phonelogin: 手机号 + 密码登录完整流程
    # order
    story_aggregate: 聚合页 + 立即订购 + 配置选择页
    # seecar / shequ
    story_seecar: 看车 Tab + Q05 车型入口
    story_shequoy: 社区 Tab
    story_topicsquare: 话题广场
    story_topicallpage: 所有圈子（地域筛选）
    story_topiccontent: 社区内容标签（最新/视频/关注/聊天）
    # huodong
    story_huodongstatus: 活动状态筛选
    # fatie
    story_postentry: 发帖入口 + 发文章
    story_fatiefull: 完整发帖（含上传封面/内容图，RUN_PUBLISH=1 启用）
    story_fatieinput: 数据驱动：标题 + 富文本内容输入
    # fuwu
    story_fuwutab: 服务 Tab
    story_storeentry: 门店跳转
    story_storeaddress: 门店位置按钮
    story_storeaddresssubmit: 位置弹窗确定
    story_storedelivermaint: 门店详情 → 交付 → 维保 → 返回
    story_storecharge: 家充服务
    # mine
    story_mineentry: 我的入口
    story_mineskin: 皮肤卡片切换
    story_minesetting: 设置 + 个人资料
    story_minenickname: 修改昵称
    story_minesettingback: 设置页返回
    story_minesign: 签到（含已签到容错）
    story_mineconyb: 源宝
    story_mineconyblevel: 定级积分
    story_mineorder: 我的订单
    story_mineshop: 车主店铺
    story_minecrosscity: 同城活动
    story_minecard: 我的卡券
    story_mineevaluation: 在线评价
    # buycar
    story_buyconfig: 购车完整配置 + 订购流程
    story_buypay: 支付定金返回

# ---- 收集顺序稳定性（业务强状态链要求用例 1->35 按编号顺序执行） ----
# 显式声明模块文件名匹配规则：test_<用例起始号>_<业务>.py
# 确保跨平台 / 不同文件系统下，pytest 都按编号升序收集，不会因字母序乱掉。
python_files = test_*.py
python_functions = test_*
python_classes = Test*